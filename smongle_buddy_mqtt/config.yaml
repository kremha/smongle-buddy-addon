name: "Smongle Buddy MQTT"
slug: "smongle_buddy_mqtt"
description: "Liest den Smongle Buddy über USB-Serial aus und veröffentlicht die Daten per MQTT."
version: "0.1.5"
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
uart: true
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  serial_device: ""
  operation_mode: "Automatik (PUSH)"
  poll_interval: 5
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  serial_device: str
  operation_mode: list(Automatik (PUSH)|Manuell (PULL))
  poll_interval: int(1,15)
