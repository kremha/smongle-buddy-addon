configuration:
  mqtt_host:
    name: "MQTT Broker"
    description: "Die IP-Adresse oder der Hostname deines MQTT-Brokers (z.B. core-mosquitto)."
  mqtt_port:
    name: "MQTT Port"
    description: "Der Port des MQTT-Brokers (Standard: 1883)."
  mqtt_username:
    name: "MQTT Benutzername"
    description: "Der Benutzername für die Verbindung zum MQTT-Broker."
  mqtt_password:
    name: "MQTT Passwort"
    description: "Das zugehörige Passwort für den MQTT-Broker."
  serial_device:
    name: "USB / Serieller Pfad"
    description: "Der Pfad zur seriellen Schnittstelle deines USB-Geräts (z.B. /dev/ttyACM0 oder /dev/ttyUSB0)."
  operation_mode:
    name: "Betriebsmodus"
    description: "Wähle zwischen automatischem PUSH (Gerät sendet selbstständig) und manuellem PULL (Add-on fragt aktiv ab)."
  poll_interval:
    name: "Manuelles Abfrageintervall (Minuten)"
    description: "Gültig im Modus 'Manuell (PULL)': Legt fest, wie oft die Daten abgefragt werden (1 bis 15 Minuten)."